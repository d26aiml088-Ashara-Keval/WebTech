<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Hub | Flex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">S</span> Student Hub</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="register.html">Register</a>
                <a href="Dashboard.html">Dashboard</a>
                <a href="events.html">Events</a>
                <a href="faq.html">FAQ</a>
                <a href="feedback.html">Feedback</a>
                <a href="contact.html">Contact</a>
                <a href="profile.html">Profile</a>
                <a href="admin.html">Admin</a>
                <a href="login.html">Login</a>
            </nav>
            <button class="theme-toggle" type="button" aria-label="Switch to dark mode" data-theme-toggle>Dark mode</button>
        </div>
    </header>
    <main class="page-shell">
        <header class="page-intro">
            <p class="eyebrow">Layout demo</p>
            <h1>Flex Page</h1>
        </header>
        <section class="content-panel">
            <p>This page is ready for a flexible layout demo and now includes the same site navigation.</p>
        </section>
    </main>
    <footer class="site-footer"><p>Student Hub · A better-connected campus</p></footer>
    <script>
        const toggle = document.querySelector('[data-theme-toggle]');
        const applyTheme = (theme) => {
            const isDark = theme === 'dark';
            document.body.classList.toggle('dark-mode', isDark);
            if (toggle) {
                toggle.textContent = isDark ? 'Light mode' : 'Dark mode';
                toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            }
        };

        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

        toggle?.addEventListener('click', () => {
            const nextTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });
    </script>
</body>
</html>
